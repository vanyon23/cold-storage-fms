<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ColdStore FMS · Cold Storage Food Management</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">❄</span> ColdStore FMS</div>
    <nav id="nav">
      <a data-page="dashboard">Dashboard</a>
      <a data-page="stockin">Stock In</a>
      <a data-page="stockout">Stock Out</a>
      <a data-page="customers">Customers</a>
      <a data-page="chambers">Chambers</a>
      <a data-page="items">Food Items</a>
      <a data-page="temperature">Temperature Logs</a>
      <a data-page="invoices">Data</a>
    </nav>
    <div class="user-box">
      <div id="userName"></div>
      <button class="btn small ghost" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div id="pageActions"></div>
    </header>
    <section id="content"></section>
  </main>

  <!-- Reusable form popup -->
  <dialog id="modal">
    <form id="modalForm" method="dialog">
      <h2 id="modalTitle"></h2>
      <div id="modalFields" class="form-grid"></div>
      <p class="error" id="modalError"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
